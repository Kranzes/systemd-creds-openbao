name: Update vendorHash

on:
  pull_request:
    paths:
      - go/go.mod
      - go/go.sum

permissions:
  contents: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
      - name: Update vendorHash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          sed -i 's|vendorHash = "[^"]*"|vendorHash = lib.fakeHash|' nix/package.nix
          hash=$(nix-build -A packages.systemd-creds-openbao.goModules 2>&1 | grep -oP 'got:\s+\K\S+' || true)
          [ -n "$hash" ]
          sed -i "s|vendorHash = lib.fakeHash|vendorHash = \"$hash\"|" nix/package.nix
          if [[ -n $(git diff) ]]; then
            git config user.name "dependabot[bot]"
            git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
            git commit -am "nix: Update vendorHash"
            git push origin HEAD:"$HEAD_REF"
          fi
