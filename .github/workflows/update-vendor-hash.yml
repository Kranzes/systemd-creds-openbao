name: Update vendorHash

on:
  pull_request:
    paths:
      - go/go.mod
      - go/go.sum

permissions:
  contents: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: NixOS/nix-installer-action@main
      - name: Update vendorHash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          sed -i 's|vendorHash = "[^"]*"|vendorHash = lib.fakeHash|' nix/package.nix
          hash=$(nix-build -A packages.systemd-creds-openbao.goModules 2>&1 | grep -oP 'got:\s+\K\S+' || true)
          [ -n "$hash" ]
          sed -i "s|vendorHash = lib.fakeHash|vendorHash = \"$hash\"|" nix/package.nix
          if [[ -n $(git diff) ]]; then
            git config user.name "dependabot[bot]"
            git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
            git commit -am "nix: Update vendorHash"
            git push origin HEAD:"$HEAD_REF"
          fi
