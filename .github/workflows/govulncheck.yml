name: govulncheck

on:
  schedule:
    # Weekly, off-peak (UTC).
    - cron: "23 4 * * 1"
  pull_request:
    paths:
      - go/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
      - uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          version: v3.0.0
          upstream-cache-filter: true
      - run: nix-shell --run 'cd go && govulncheck ./...'
