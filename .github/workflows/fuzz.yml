name: Fuzz

on:
  schedule:
    # Weekly, off-peak (UTC).
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      # A crash in one target must not cancel the other's run.
      fail-fast: false
      matrix:
        include:
          - target: FuzzParsePeer
            package: internal/credserver
          - target: FuzzResolve
            package: internal/secrets
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1
      - uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          version: v3.0.0
          upstream-cache-filter: true
      # Caches are immutable, so each run saves the grown corpus under a new
      # key and restores the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Run ${{ matrix.target }}
        # A failure saying "context deadline exceeded" without a crash input
        # is golang/go#75804, a shutdown race in go1.26 fixed in go1.27.
        run: nix-shell --run 'cd go && go test -fuzz=${{ matrix.target }} -fuzztime=10m -run "^$" ./${{ matrix.package }}'
      # A crash is minimized into the package's testdata/fuzz directory.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: failing-inputs-${{ matrix.target }}
          path: go/${{ matrix.package }}/testdata/fuzz/
